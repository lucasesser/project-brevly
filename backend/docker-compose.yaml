services:
  brevly-server:
    build: .
    ports:
      - '3333:3333'
    depends_on:
     - pg
    env_file:
     - .env

  pg:
    image: 'bitnami/postgresql'
    ports: 
      - '5432:5432'
    environment:
      - POSTGRESQL_USERNAME=docker
      - POSTGRESQL_PASSWORD=docker
      - POSTGRESQL_DATABASE=mylinks